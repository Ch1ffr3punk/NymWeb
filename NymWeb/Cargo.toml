[package]
name = "nymweb"
version = "0.1.0"
edition = "2021"
authors = ["Ch1ffr3punk"]
description = "Nym Web Proxy - (c) 2026 Ch1ffr3punk"

[[bin]]
name = "encode"
path = "src/bin/encode.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
hyper = { version = "1.2", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1.5"
bs58 = "0.5"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
http = "1.1"
